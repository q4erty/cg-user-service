spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:0/invalid-jwks

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.flywaydb: INFO
    org.testcontainers: INFO

keycloak:
  admin:
    server-url: http://localhost:0
    realm: cloud-gaming
    target-realm: cloud-gaming
    client-id: test-client
    client-secret: test-secret
